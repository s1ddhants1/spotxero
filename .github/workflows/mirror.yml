name: Mirror to GitLab

on:
  push:
  delete:
  workflow_dispatch:

concurrency:
  group: gitlab-mirror
  cancel-in-progress: true

jobs:
  mirror:
    name: Sync Repository to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to GitLab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --mirror "https://x-access-token:${GITHUB_TOKEN}@github.com/s1ddhants1/spotxero.git" repo.git
          cd repo.git
          git push --prune --mirror "https://oauth2:${GITLAB_TOKEN}@gitlab.com/s1ddhants1/spotxero.git"
